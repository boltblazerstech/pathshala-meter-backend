# ── Server ──
server.port=${SERVER_PORT:8081}

# ── Datasource (Aiven Postgres via env vars) ──
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pathshala_stub}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Suppress auto-generated password (we handle auth via JWT filter, no UserDetailsService needed)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ── JWT ──
jwt.secret=${JWT_SECRET:change-me-in-production-this-is-a-stub-secret-key-at-least-256-bits-long}
jwt.expiration-ms=86400000

# ── Tracking window defaults ──
tracking.default-start=09:00
tracking.default-end=17:00
tracking.default-interval=15
