# ── Server ──
server.port=${SERVER_PORT:8081}

# ── Datasource (Aiven Postgres via env vars) ──
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pathshala_stub}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──
# Flyway owns the schema — Hibernate only validates on startup
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Suppress auto-generated password (we handle auth via JWT filter, no UserDetailsService needed)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ── Flyway ──
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate: DB already had a location_points table from the stub phase.
# This tells Flyway not to fail on a non-empty DB for its very first run.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── JWT ──
jwt.secret=${JWT_SECRET:change-me-in-production-this-is-a-stub-secret-key-at-least-256-bits-long}
jwt.expiration-ms=86400000

# ── Tracking window defaults ──
tracking.default-start=09:00
tracking.default-end=17:00
tracking.default-interval=15
